<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173F35">
<title>Abrir eStore CE+PI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#f5f0e7;font-family:Arial,Helvetica,sans-serif;color:#173F35}
.card{width:min(420px,100%);background:#fff;border-radius:28px;padding:28px 24px;text-align:center;box-shadow:0 18px 54px rgba(23,63,53,.16)}
.icon{width:92px;height:92px;margin:0 auto 18px;border-radius:25px;overflow:hidden;box-shadow:0 10px 26px rgba(23,63,53,.18)}
.icon img{width:100%;height:100%;display:block}.brand{font-size:27px;font-weight:950;letter-spacing:-.7px}.sub{margin:8px 0 18px;color:#65736e;font-size:14px;line-height:1.45}
.bar{height:8px;border-radius:99px;background:#ece9e1;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:#DE7C00;border-radius:99px;animation:go 1.05s ease-in-out infinite}
.status{margin-top:12px;font-size:12px;font-weight:800;color:#466964}.btn{display:none;width:100%;margin-top:18px;border:0;border-radius:14px;padding:14px;background:#173F35;color:#fff;font-weight:900;font-size:14px}
@keyframes go{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
</style>
</head>
<body>
<div class="card">
  <div class="icon"><img src="./icon-v136.svg" alt=""></div>
  <div class="brand">eStore CE+PI</div>
  <div class="sub">Preparando uma abertura limpa do App para atualizar o cache do seu celular.</div>
  <div class="bar"><i></i></div>
  <div id="status" class="status">Atualizando…</div>
  <button id="btn" class="btn" onclick="openApp()">Abrir App</button>
</div>
<script>
function openApp(){location.replace('./?fresh=1')}
(async()=>{
  const s=document.getElementById('status'),b=document.getElementById('btn');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>String(r.scope||'').includes('/app-estore-cepi/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('estore-cepi-shell-')).map(k=>caches.delete(k)));
    }
    s.textContent='Pronto. Abrindo o App…';
    setTimeout(openApp,700);
  }catch(e){
    s.textContent='Atualização pronta. Toque abaixo para abrir.';
    b.style.display='block';
  }
})();
</script>
</body>
</html>
