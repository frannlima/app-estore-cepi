async function editHour(id,v,o){let captured=prompt('Novo valor incremental:',v);if(captured===null)return;let orders=prompt('Nova quantidade de pedidos:',o);if(orders===null)return;await api({action:'hourly_manage',matricula:U.u.id,id,op:'edit',captured:Number(String(captured).replace(',','.')),orders:Number(orders)});loadHourly()}
async function deleteHour(id){if(!confirm('Excluir logicamente este lançamento? O histórico de auditoria será preservado.'))return;await api({action:'hourly_manage',matricula:U.u.id,id,op:'delete'});loadHourly()}
function support(){return '<div class=card><div class=title>Chat / Suporte</div><div class=notice><b>'+esc(U.u.id)+' • '+esc(displayName().split(' ')[0])+' • Filial '+esc(U.u.st)+'</b></div><div id=thread></div><textarea id=smsg class=field rows=4 placeholder="Digite sua mensagem"></textarea><label class=btn style="display:inline-block;margin:8px 8px 8px 0;cursor:pointer">📎 Foto, vídeo ou arquivo<input id=sattach type=file accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt" style="display:none" onchange="showSupportFile()"></label><span id=sfile class=muted></span><br><button class=btn onclick="sendSupport()">Enviar</button><div id=ssend></div></div>'}
function showSupportFile(){let f=$('#sattach').files[0];$('#sfile').textContent=f?f.name:''}
function supportAttachment(m){if(!m.attachment_url)return '';let t=String(m.attachment_type||''),u=esc(m.attachment_url),n=esc(m.attachment_name||'Arquivo');if(t.startsWith('image/'))return '<a href="'+u+'" target=_blank><img src="'+u+'" alt="'+n+'" style="max-width:100%;max-height:280px;border-radius:14px;margin-top:8px"></a>';if(t.startsWith('video/'))return '<video controls playsinline style="width:100%;max-height:320px;border-radius:14px;margin-top:8px"><source src="'+u+'" type="'+esc(t)+'"></video>';return '<div style="margin-top:8px"><a class=btn href="'+u+'" target=_blank rel=noopener>📎 '+n+'</a></div>'}
async function loadSupport(){try{let j=await api({action:'support_get',matricula:U.u.id});$('#thread').innerHTML=(j.messages||[]).map(m=>'<div class="notice '+(m.sender_role==='admin'?'success':'')+'"><b>'+(m.sender_role==='admin'?'Suporte':'Você')+'</b><br>'+esc(m.message||'')+supportAttachment(m)+'<div class=muted>'+new Date(m.created_at).toLocaleString('pt-BR')+'</div></div>').join('')}catch(e){$('#thread').innerHTML='<div class="notice danger">'+esc(e.message)+'</div>'}}
async function sendSupport(){let message=$('#smsg').value.trim(),file=$('#sattach').files[0];if(!message&&!file)return alert('Digite uma mensagem ou selecione um arquivo.');if(file&&file.size>10485760)return alert('O arquivo deve ter no máximo 10 MB.');let st=$('#ssend');st.innerHTML='<div class=notice>Enviando...</div>';let fd=new FormData();fd.append('action','support_send');fd.append('matricula',U.u.id);fd.append('store_code',U.u.st);fd.append('message',message);if(file)fd.append('attachment',file,file.name);try{let r=await fetch(API,{method:'POST',body:fd}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erro ao enviar');$('#smsg').value='';$('#sattach').value='';$('#sfile').textContent='';st.innerHTML='';loadSupport()}catch(e){st.innerHTML='<div class="notice danger">'+esc(e.message)+'</div>'}}
function displayName(){return CONTENT.preferredNames?.[String(U.u.id)]||U.u.name}
function profile(){let dn=displayName();return '<div class=card><div class=profileHead>'+photo(U.u.id,dn,'photoBig')+'<div><div class=title>'+esc(dn)+'</div><div class=muted>Matrícula '+esc(U.u.id)+' • Filial '+esc(U.u.st)+'<br>'+esc(U.u.role)+'</div></div></div><div class=card style="box-shadow:none;background:#f7f6f2"><div class=title>Personalizar meu perfil</div><div class=muted>Escolha como seu nome aparecerá na tela inicial e adicione sua foto.</div><input id=prefName class=field maxlength=40 value="'+esc(dn)+'" placeholder="Nome de preferência"><input id=profilePhoto type=file accept="image/*" class=field><button class=btn onclick="saveMyProfile()">Salvar perfil</button><div id=profileSaveStatus></div></div><div class=notice>Moda que inspira o Brasil.<br><br>Vontade de crescer • Ninguém faz nada sozinho • O simples é incrível • Talento é conquista</div><button class="btn warn" onclick="location.reload()">Sair</button></div>'}
async function saveMyProfile(){let name=$('#prefName').value.trim(),file=$('#profilePhoto').files[0],st=$('#profileSaveStatus');if(!name)return alert('Informe o nome de preferência.');st.innerHTML='<div class=notice>Salvando perfil...</div>';try{await api({action:'profile_preferences_set',matricula:U.u.id,preferred_name:name});CONTENT.preferredNames=CONTENT.preferredNames||{};CONTENT.preferredNames[String(U.u.id)]=name;if(file){let dataUrl=await resizeProfilePhoto(file);let j=await api({action:'profile_photo_set',matricula:U.u.id,dataUrl});CONTENT.profilePhotos[String(U.u.id)]=j.photo_url}st.innerHTML='<div class="notice success">Perfil atualizado com sucesso.</div>';setTimeout(()=>go('profile'),500)}catch(e){st.innerHTML='<div class="notice danger">'+esc(e.message)+'</div>'}}
function resizeProfilePhoto(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onerror=reject;r.onload=()=>{let im=new Image();im.onerror=reject;im.onload=()=>{let size=Math.min(im.width,im.height),sx=(im.width-size)/2,sy=(im.height-size)/2,c=document.createElement('canvas');c.width=c.height=640;c.getContext('2d').drawImage(im,sx,sy,size,size,0,0,640,640);resolve(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}
function admin(){if(!isAdmin())return '<div class=notice>Acesso administrativo não autorizado.</div>';return '<div class=card><div class=title>Central Administrativa</div><div class=muted>Atualização de dados, configurações e gestão do App.</div><div class=adminGrid style="margin-top:14px"><button class=btn onclick="adminResults()">Atualizar Resultados</button><button class=btn onclick="adminTargets()">Atualizar Metas</button><button class=btn onclick="adminDatabase()">Banco de Dados</button><button class=btn onclick="adminInfo()">Informações Importantes</button><button class=btn onclick="adminCampaign()">Cupons e Campanhas</button><button class=btn onclick="adminEday()">eDay</button><button class=btn onclick="adminNotify()">Notificações</button><button class=btn onclick="go(&quot;hourly&quot;)">Hora a Hora</button><button class=btn onclick="go(&quot;support&quot;)">Chat / Suporte</button></div></div><div id=adminWork></div><div class=card><div class=title>Auditoria recente</div><div id=audit class=muted>Carregando...</div></div>'}
async function adminResults(){$('#adminWork').innerHTML='<div class=card><div class=title>Input • Resultado eStore</div><div class=muted>Importe os dois relatórios do mesmo dia. O histórico é atualizado sem apagar períodos anteriores.</div><input id=impDate type=date class=field><label>Relatório por colaborador</label><input id=impColl type=file accept=".xlsx,.xls" class=field><label>Relatório gestão / lojas</label><input id=impMgmt type=file accept=".xlsx,.xls" class=field><button class=btn onclick="sendResults()">Processar e atualizar resultados</button><div id=impStatus></div></div>'}
async function sendResults(){let d=$('#impDate').value,a=$('#impColl').files[0],b=$('#impMgmt').files[0];if(!d||!a||!b)return alert('Informe a data e selecione os dois relatórios.');let fd=new FormData();fd.append('action','daily_update');fd.append('matricula',U.u.id);fd.append('password',adminPwd());fd.append('date',d);fd.append('collaborators',a);fd.append('management',b);$('#impStatus').innerHTML='<div class=notice>Processando relatórios...</div>';try{let j=await apiForm(fd);$('#impStatus').innerHTML='<div class="notice success">'+esc(j.message)+'<br>'+j.collaborators+' colaboradores • '+j.management+' registros de lojas</div>';await reloadDashboard()}catch(e){$('#impStatus').innerHTML='<div class="notice danger">'+esc(e.message)+'</div>'}}
function adminTargets(){$('#adminWork').innerHTML='<div class=card><div class=title>Input • Metas de Venda</div><div class=muted>A meta eStore será calculada a 1% da Meta Fin e incorporada ao histórico/visão anual.</div><input id=metaFile type=file accept=".xlsx,.xls" class=field><button class=btn onclick="sendTargets()">Processar metas</button><div id=metaStatus></div></div>'}
async function sendTargets(){let a=$('#metaFile').files[0];if(!a)return alert('Selecione o arquivo de metas.');let fd=new FormData();fd.append('action','meta_update');fd.append('matricula',U.u.id);fd.append('password',adminPwd());fd.append('meta',a);$('#metaStatus').innerHTML='<div class=notice>Processando metas...</div>';try{let j=await apiForm(fd);$('#metaStatus').innerHTML='<div class="notice success">'+esc(j.message)+'<br>'+j.rows+' linhas • '+j.stores+' filiais • '+esc(j.minDate)+' a '+esc(j.maxDate)+'</div>';await reloadDashboard()}catch(e){$('#metaStatus').innerHTML='<div class="notice danger">'+esc(e.message)+'</div>'}}
async function adminDatabase(){try{let j=await api({action:'delta'});$('#adminWork').innerHTML='<div class=card><div class=title>Banco de Dados • Status</div><div class=grid><div class=kpi>Base histórica<b>'+esc(j.baseline||'—')+'</b></div><div class=kpi>Última atualização<b>'+esc(j.asof||'—')+'</b></div><div class=kpi>Atualizações<b>'+num((j.updates||[]).length)+'</b></div><div class=kpi>Metas individuais<b>'+num((j.metaAssignments||[]).length)+'</b></div></div><div class=notice>Banco operacional conectado ao Supabase. Use Atualizar Resultados e Atualizar Metas para novos inputs.</div></div>'}catch(e){$('#adminWork').innerHTML='<div class="notice danger">'+esc(e.message)+'</div>'}}
async function reloadDashboard(){let j=await api({action:'dashboard',matricula:U.u.id});if(j.user)U={...U,...j.user};if(j.common)COMMON=j.common;render()}
function adminPwd(){if(!ADMIN_PWD)ADMIN_PWD=prompt('Senha administrativa:')||'';return ADMIN_PWD}

async function adminCampaign(){let title=prompt('Nome/cupom da campanha:');if(!title)return;let text=prompt('Mecânica, regras, período e benefícios:');if(text===null)return;let value=[...(CONTENT.campaigns||[]),{title,text,created_at:new Date().toISOString()}];await api({action:'content_publish',matricula:U.u.id,password:adminPwd(),kind:'campaigns_config',value});await refreshExtras();go('campaigns')}
async function adminEday(){let active=confirm('OK = ativar eDay. Cancelar = desativar.');let start=prompt('Início (AAAA-MM-DD):',EDAY.start||'2026-09-01')||'';let end=prompt('Encerramento (AAAA-MM-DD, deixe vazio se não definido):',EDAY.end||'')||'';await api({action:'eday_update',matricula:U.u.id,password:adminPwd(),active,start,end});await refreshExtras();go('home')}
async function adminNotify(){let title=prompt('Título:');if(!title)return;let message=prompt('Mensagem:');if(!message)return;let target=prompt('Destino: regional | store | supervisors | matricula','regional')||'regional';let store_code=target==='store'?prompt('Filial (3 dígitos):','108')||'':'';let target_matricula=target==='matricula'?prompt('Matrícula:')||'':'';let map={regional:'all',store:'store',supervisors:'supervisors',matricula:'matricula'};await api({action:'notification_publish',matricula:U.u.id,password:adminPwd(),title,message,target:map[target]||'all',store_code,target_matricula});alert('Notificação publicada.')}
async function loadAudit(){try{let j=await api({action:'audit_get',matricula:U.u.id});$('#audit').innerHTML=(j.items||[]).slice(0,50).map(x=>'<div class=hourrow><b>'+esc(x.event_type)+'</b><div>'+esc(x.entity)+'<div class=muted>'+esc(x.actor_matricula||'')+' • '+new Date(x.created_at).toLocaleString('pt-BR')+'</div></div><small>'+esc(x.store_code||'')+'</small></div>').join('')||'Sem eventos.'}catch(e){$('#audit').innerHTML='<div class="notice danger">'+esc(e.message)+'</div>'}}
