<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eStore Click | Talento em Cena</title>
<style>:root{font-family:Arial,sans-serif;color:#092e2a;background:#f7f2e9}*{box-sizing:border-box}body{margin:0}header{background:#073d32;color:white;padding:18px;text-align:center}header small{display:block;margin-top:6px}main{max-width:520px;margin:auto;padding:16px}h1{margin:10px 0}p{line-height:1.45}.panel{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #0001}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:13px 16px;background:#064a3b;color:white;cursor:pointer;font-weight:bold}button.secondary{background:#e9d3af;color:#163e34}button:disabled{opacity:.45}.buttons{display:flex;flex-wrap:wrap;gap:8px}.buttons>*{flex:1}label{display:block;margin:12px 0 5px;font-weight:bold}input[type=text],select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px}canvas{width:100%;height:auto;background:#eee;border-radius:12px}video{width:100%;border-radius:12px;display:none}#status{font-size:13px;color:#456}footer{text-align:center;font-size:12px;padding:15px}input[type=file]{display:none}</style></head>
<body><header><strong>RIACHUELO</strong><small>eStore Connect · CE+PI</small></header><main><h1>eStore Click</h1><p>Talento em Cena · Registre, personalize e celebre conquistas.</p>
<div class="panel"><div class="buttons"><button id="quick">Reconhecimento rápido</button><button class="secondary" id="studio">Estúdio eStore</button></div><p id="mode">Modo: Reconhecimento rápido</p><div class="buttons"><button id="camera">Abrir câmera</button><button class="secondary" id="gallery">Escolher da galeria</button></div><input type="file" accept="image/*" capture="environment" id="capture"><input type="file" accept="image/*" id="upload"><video id="video" autoplay playsinline muted></video><button id="snap" hidden>Capturar foto</button></div>
<div class="panel"><label for="theme">Temática</label><select id="theme"><option>Talento em Cena</option><option>Venda Captada!</option><option>Destaque do Dia</option><option>Time que Converte</option><option>eDay</option></select><label for="name">Nome do talento ou equipe</label><input id="name" type="text" placeholder="Nome do colaborador"><label for="store">Filial</label><input id="store" type="text" placeholder="Ex.: 108"><div id="filters"><label for="bright">Iluminação</label><input type="range" id="bright" min="70" max="140" value="100"><label for="contrast">Contraste</label><input type="range" id="contrast" min="75" max="140" value="100"></div></div>
<div class="panel"><canvas id="output" width="1080" height="1350" aria-label="Prévia da arte"></canvas><div class="buttons"><button id="download">Baixar PNG</button><button id="share" class="secondary">Compartilhar</button></div><p id="status" role="status">Escolha uma foto para começar.</p></div></main><footer>Talento é conquista! · Moda que inspira o Brasil.</footer>
<script>
const $=id=>document.getElementById(id),c=$('output'),ctx=c.getContext('2d');let photo=null,stream=null,studio=false;
function draw(){const w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#f2e4d0';ctx.fillRect(0,0,w,h);if(photo){const s=Math.max(w/photo.width,h/photo.height),pw=photo.width*s,ph=photo.height*s;ctx.save();ctx.filter='brightness('+ (studio?$('bright').value:100)+'%) contrast('+(studio?$('contrast').value:100)+'%)';ctx.drawImage(photo,(w-pw)/2,(h-ph)/2,pw,ph);ctx.restore()}else{ctx.fillStyle='#48675c';ctx.textAlign='center';ctx.font='44px Arial';ctx.fillText('Sua foto aqui',w/2,h/2)}
const grad=ctx.createLinearGradient(0,850,0,h);grad.addColorStop(0,'#073d3200');grad.addColorStop(.6,'#073d32db');grad.addColorStop(1,'#052e29');ctx.fillStyle=grad;ctx.fillRect(0,830,w,520);
ctx.fillStyle='#f4e5cc';ctx.fillRect(0,0,w,125);ctx.fillStyle='#083d32';ctx.textAlign='left';ctx.font='bold 43px Arial';ctx.fillText('RIACHUELO',45,76);ctx.textAlign='right';ctx.font='bold 36px Arial';ctx.fillText('CE+PI',1030,76);
ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 76px Arial';ctx.fillText($('theme').value,50,1070);ctx.font='bold 44px Arial';const n=$('name').value.trim();if(n)ctx.fillText(n.slice(0,28),50,1140);ctx.font='36px Arial';ctx.fillText('Talento é conquista!',50,1210);ctx.font='26px Arial';ctx.fillText('Moda que inspira o Brasil',50,1270);ctx.textAlign='right';ctx.fillText($('store').value?'Filial '+$('store').value:'eStore Connect',1030,1285)}
function load(file){if(!file||!file.type.startsWith('image/'))return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{photo=img;draw();URL.revokeObjectURL(url);$('status').textContent='Foto carregada. Personalize e compartilhe.'};img.src=url}
$('capture').onchange=e=>load(e.target.files[0]);$('upload').onchange=e=>load(e.target.files[0]);$('gallery').onclick=()=>$('upload').click();$('camera').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('video').srcObject=stream;$('video').style.display='block';$('snap').hidden=false;$('status').textContent='Câmera ativa.'}catch(e){$('status').textContent='Não foi possível abrir a câmera ao vivo. Use a captura do aparelho.';$('capture').click()}};
$('snap').onclick=()=>{const v=$('video');if(v.videoWidth){const temp=document.createElement('canvas');temp.width=v.videoWidth;temp.height=v.videoHeight;temp.getContext('2d').drawImage(v,0,0);const img=new Image();img.onload=()=>{photo=img;draw()};img.src=temp.toDataURL('image/jpeg',.92)}stream?.getTracks().forEach(t=>t.stop());stream=null;v.style.display='none';$('snap').hidden=true};
$('quick').onclick=()=>{studio=false;$('mode').textContent='Modo: Reconhecimento rápido';$('filters').hidden=true;draw()};$('studio').onclick=()=>{studio=true;$('mode').textContent='Modo: Estúdio eStore';$('filters').hidden=false;draw()};
['theme','name','store','bright','contrast'].forEach(id=>$(id).addEventListener('input',draw));
function blob(){return new Promise(resolve=>c.toBlob(resolve,'image/png'))}
$('download').onclick=async()=>{const b=await blob(),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='estore-click-cepi.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('share').onclick=async()=>{const b=await blob(),file=new File([b],'estore-click-cepi.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Talento é conquista!'});return}throw Error('Compartilhamento de imagem indisponível neste navegador')}catch(e){$('status').textContent='Use Baixar PNG e compartilhe a imagem pelo WhatsApp.'}};
$('filters').hidden=true;draw();
</script></body></html>
