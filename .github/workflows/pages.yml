name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Hora a Hora and Alerts
        run: |
          node --check hourly-live-v200.js
          node --check hourly-alert-queue-v225.mjs
          node --check alert-center.js
          node --check alert-center-core.mjs
          node --test tests/alert-center.test.mjs tests/hourly-alert-queue-v225.test.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare local OCR assets for mobile print reading
        shell: bash
        run: |
          set -euo pipefail
          TEMP_OCR="$RUNNER_TEMP/estore-ocr"
          mkdir -p "$TEMP_OCR" vendor/ocr/core vendor/ocr/lang
          npm install --prefix "$TEMP_OCR" --ignore-scripts --no-audit --no-fund --no-package-lock tesseract.js@5.1.1 tesseract.js-core@5.1.1 @tesseract.js-data/eng@1.0.0
          BASE="$TEMP_OCR/node_modules"
          cp "$BASE/tesseract.js/dist/tesseract.min.js" vendor/ocr/tesseract.min.js
          cp "$BASE/tesseract.js/dist/worker.min.js" vendor/ocr/worker.min.js
          cp "$BASE/tesseract.js-core/"tesseract-core*.wasm* vendor/ocr/core/
          cp "$BASE/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz" vendor/ocr/lang/eng.traineddata.gz
          for pkg in tesseract.js tesseract.js-core; do
            license="$(find "$BASE/$pkg" -maxdepth 1 -type f -iname 'LICENSE*' -print -quit)"
            if [ -n "$license" ]; then cp "$license" "vendor/ocr/${pkg}-LICENSE"; fi
          done
          test -s vendor/ocr/tesseract.min.js
          test -s vendor/ocr/worker.min.js
          test -s vendor/ocr/core/tesseract-core-simd-lstm.wasm
          test -s vendor/ocr/lang/eng.traineddata.gz
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
